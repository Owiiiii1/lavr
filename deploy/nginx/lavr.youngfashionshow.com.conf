# LAVR-only vhost. Do not copy this into other project files.
# PHP-FPM: php8.5-fpm.sock (isolated from php8.3-fpm used by other sites).

server {
    listen 80;
    listen [::]:80;
    server_name lavr.youngfashionshow.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lavr/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lavr.youngfashionshow.com;

    root /var/www/lavr/public;
    index index.php;

    access_log /var/log/nginx/lavr_access.log;
    error_log /var/log/nginx/lavr_error.log;

    ssl_certificate /etc/letsencrypt/live/lavr.youngfashionshow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lavr.youngfashionshow.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    charset utf-8;
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
