# LAVR public vhost — lavr.youngfashionshow.com
#
# Document root: /var/www/lavr/public
#
# PHP-FPM: this host currently has php8.3-fpm only. Laravel/Symfony 8 in this
# tree requires PHP >= 8.4 (property hooks). Enabling this vhost against
# php8.3-fpm will 500 until php8.4-fpm or php8.5-fpm is installed.
# After installing a compatible FPM, set fastcgi_pass to that socket.
#
# Install (requires root / passwordless sudo):
#   sudo cp /var/www/lavr/deploy/nginx/lavr.youngfashionshow.com.conf \
#     /etc/nginx/sites-available/lavr.youngfashionshow.com
#   sudo ln -sf /etc/nginx/sites-available/lavr.youngfashionshow.com \
#     /etc/nginx/sites-enabled/lavr.youngfashionshow.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lavr.youngfashionshow.com --redirect --non-interactive --agree-tos -m <ops-email>
#
# Phase 1 could not run those commands: sudo requires a password.

server {
    listen 80;
    listen [::]:80;
    server_name lavr.youngfashionshow.com;

    root /var/www/lavr/public;
    index index.php;

    access_log /var/log/nginx/lavr_access.log;
    error_log /var/log/nginx/lavr_error.log;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    charset utf-8;
    client_max_body_size 32M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lavr/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
